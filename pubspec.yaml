name: metropol
description: Arkadaşlarla gerçek zamanlı oynanan modern Metropol tarzı emlak oyunu.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0' # Flutter 3.27+

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_database: ^11.1.0

  # Yerel profil saklama
  shared_preferences: ^2.3.2

  # Ses
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
