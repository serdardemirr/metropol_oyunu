workflows:
  ios-sideload:
    name: iOS Sideload Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign
      - name: Package Runner.app
        script: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
    artifacts:
      - build/ios/Payload/**